services:
  db:
    image: mysql:8.0
    container_name: smartep-db
    restart: always
    environment:
      MYSQL_DATABASE: smartep
      MYSQL_ROOT_PASSWORD: Rootacc@25
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootacc@25"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./smartep
    container_name: smartep-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/smartep?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Rootacc@25
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  frontend:
    build: ./frontend
    container_name: smartep-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db-data:
